  <g transform="translate(763 30)"><rect width="396" height="190" rx="11" fill="#101D27" stroke="#375061"/><path d="M0 40H396" stroke="#375061"/><circle cx="20" cy="20" r="4" fill="#C6F476" class="s"/><text x="34" y="24" class="c" font-size="10.5" fill="#E2F0DF">TWEAKS · READ BACK</text><text x="378" y="24" text-anchor="end" class="c" font-size="10" fill="#778F9F">47</text><rect x="16" y="58" width="364" height="30" rx="6" fill="#142630"/><text x="30" y="78" class="f" font-size="13" fill="#F1F5F9">Disable telemetry</text><text x="300" y="78" text-anchor="end" class="c" font-size="9.5" fill="#C6F476" letter-spacing="1">ON ✓</text><text x="368" y="78" text-anchor="end" class="f" font-size="11.5" fill="#8DDBDF">Undo</text><rect x="16" y="96" width="364" height="30" rx="6" fill="#142630"/><text x="30" y="116" class="f" font-size="13" fill="#F1F5F9">Game Mode</text><text x="300" y="116" text-anchor="end" class="c" font-size="9.5" fill="#C6F476" letter-spacing="1">ON ✓</text><text x="368" y="116" text-anchor="end" class="f" font-size="11.5" fill="#8DDBDF">Undo</text><rect x="16" y="134" width="364" height="30" rx="6" fill="#142630"/><text x="30" y="154" class="f" font-size="13" fill="#F1F5F9">Copilot</text><text x="300" y="154" text-anchor="end" class="c" font-size="9.5" fill="#AEBECE" letter-spacing="1">REMOVED ✓</text><text x="368" y="154" text-anchor="end" class="f" font-size="11.5" fill="#8DDBDF">Undo</text><text x="20" y="180" class="f" font-size="11.5" fill="#778F9F">Restore point first. Original value kept.</text></g>
