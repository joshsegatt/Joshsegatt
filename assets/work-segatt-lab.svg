<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
<title id="t">Segatt Lab: open-source Windows 10 and 11 tuning, debloat, cleanup and repair, with live state and one-click undo.</title>
<defs>
  <linearGradient id="b" x2="1" y2="1"><stop stop-color="#0C1118"/><stop offset=".6" stop-color="#101A24"/><stop offset="1" stop-color="#0C131C"/></linearGradient>
  <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E0EA" stroke-opacity=".045"/></pattern>
  <clipPath id="r"><rect width="1200" height="250" rx="14"/></clipPath>
  <style>
    .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .c{font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;font-weight:700}
    @keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes rt{to{stroke-dashoffset:-84}}
    .s{animation:br 3s ease-in-out infinite}
    .tr{stroke-dasharray:5 9;animation:rt 8s linear infinite}
    @media(prefers-reduced-motion:reduce){.s,.tr{animation:none}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="250" fill="url(#b)"/><rect width="1200" height="250" fill="url(#g)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="14" fill="none" stroke="#52677B" stroke-opacity=".5"/>
  <path d="M735 0V250" stroke="#C1D0DD" stroke-opacity=".12"/>
  <text x="44" y="46" class="c" font-size="11.5" fill="#C6F476">03</text>
  <text x="73" y="46" class="c" font-size="11.5" fill="#778F9F">/  WINDOWS DESKTOP · OPEN SOURCE</text>
  <text x="42" y="92" class="f" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#F1F5F9">Segatt Lab<tspan fill="#C6F476">.</tspan></text>
  <text x="44" y="124" class="f" font-size="16.5" fill="#AEBECE">Tune, debloat, clean and repair Windows 10 and 11.</text><text x="44" y="148" class="f" font-size="16.5" fill="#AEBECE">Every change shows its live state and undoes in one click.</text>
  <rect x="44" y="178" width="68" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="78" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Tauri 2</text><rect x="119.80000000000001" y="178" width="46" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="143" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Rust</text><rect x="173.4" y="178" width="68" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="207" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Next.js</text><rect x="249.20000000000002" y="178" width="38" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="268" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">MIT</text>
  <circle cx="50" cy="228" r="3.5" fill="#C6F476" class="s"/>
