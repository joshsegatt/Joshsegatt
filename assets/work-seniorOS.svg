<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
<title id="t">SeniorOS: engineering infrastructure for coding agents. Blind round 5 on Claude Opus: 10 of 15 runs with SeniorOS, 2 of 15 for the model alone.</title>
<defs>
  <linearGradient id="b" x2="1" y2="1"><stop stop-color="#0C1118"/><stop offset=".6" stop-color="#101A24"/><stop offset="1" stop-color="#0C131C"/></linearGradient>
  <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E0EA" stroke-opacity=".045"/></pattern>
  <clipPath id="r"><rect width="1200" height="250" rx="14"/></clipPath>
  <style>
    .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .c{font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;font-weight:700}
    @keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes rt{to{stroke-dashoffset:-84}}
    .s{animation:br 3s ease-in-out infinite}
    .tr{stroke-dasharray:5 9;animation:rt 8s linear infinite}
    @media(prefers-reduced-motion:reduce){.s,.tr{animation:none}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="250" fill="url(#b)"/><rect width="1200" height="250" fill="url(#g)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="14" fill="none" stroke="#52677B" stroke-opacity=".5"/>
  <path d="M735 0V250" stroke="#C1D0DD" stroke-opacity=".12"/>
  <text x="44" y="46" class="c" font-size="11.5" fill="#C6F476">01</text>
  <text x="73" y="46" class="c" font-size="11.5" fill="#778F9F">/  AI DEVELOPER INFRASTRUCTURE</text>
  <text x="42" y="92" class="f" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#F1F5F9">SeniorOS<tspan fill="#C6F476">.</tspan></text>
  <text x="44" y="124" class="f" font-size="16.5" fill="#AEBECE">Skills and hooks that make coding agents fix the cause,</text><text x="44" y="148" class="f" font-size="16.5" fill="#AEBECE">keep history safe and prove the work with real checks.</text>
  <rect x="44" y="178" width="97" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="93" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Claude Code</text><rect x="149.4" y="178" width="53" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="176" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Codex</text><rect x="210.4" y="178" width="60" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="241" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Cursor</text><rect x="278.8" y="178" width="105" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="331" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">npx senioros</text>
  <circle cx="50" cy="228" r="3.5" fill="#C6F476" class="s"/>
  <text x="62" y="232" class="c" font-size="10.5" fill="#DBF1C3" letter-spacing="1.2">PUBLISHED BENCHMARK · METHODOLOGY + CAVEATS</text>
  <g transform="translate(763 30)"><rect width="396" height="190" rx="11" fill="#101D27" stroke="#375061"/><path d="M0 40H396" stroke="#375061"/><circle cx="20" cy="20" r="4" fill="#C6F476" class="s"/><text x="34" y="24" class="c" font-size="10.5" fill="#E2F0DF">BLIND ROUND 5</text><text x="378" y="24" text-anchor="end" class="c" font-size="10" fill="#778F9F">CLAUDE OPUS</text><text x="20" y="64" class="c" font-size="10" fill="#AEBECE">WITH SENIOROS</text><rect x="20" y="74" width="300" height="20" rx="4" fill="#142630"/><rect x="20" y="74" width="200" height="20" rx="4" fill="#C6F476"/><text x="376" y="89" text-anchor="end" class="f" font-size="17" font-weight="800" fill="#F1F5F9">10/15</text><text x="20" y="120" class="c" font-size="10" fill="#AEBECE">MODEL ALONE</text><rect x="20" y="130" width="300" height="20" rx="4" fill="#142630"/><rect x="20" y="130" width="40" height="20" rx="4" fill="#5B7183"/><text x="376" y="145" text-anchor="end" class="f" font-size="17" font-weight="800" fill="#F1F5F9">2/15</text><text x="20" y="178" class="f" font-size="11.5" fill="#778F9F">3 cause-elsewhere bugs × 5 trials. Not a universal rate.</text></g>
</g>
</svg>
