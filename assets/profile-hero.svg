<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="378" viewBox="0 0 1200 378" role="img" aria-labelledby="title desc">
<title id="title">Josh Segatt — software engineer building products and verifiable AI systems</title>
<desc id="desc">An editorial dark cover with a design-build-verify systems diagram. A restrained lime pulse traces the engineering workflow.</desc>
<defs>
  <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0C1118"/><stop offset=".57" stop-color="#101A24"/><stop offset="1" stop-color="#0C131C"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#C6F476"/><stop offset="1" stop-color="#8DDBDF"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E0EA" stroke-opacity=".045" stroke-width="1"/></pattern>
  <clipPath id="round"><rect width="1200" height="378" rx="16"/></clipPath>
  <style>
    .font{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .caps{font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;font-weight:700}
    @keyframes route{to{stroke-dashoffset:-84}}
    @keyframes breathe{0%,100%{opacity:.52}50%{opacity:1}}
    @keyframes blink{0%,70%,100%{opacity:1}75%,95%{opacity:.34}}
    .trace{stroke-dasharray:5 9;animation:route 8s linear infinite}
    .status{animation:breathe 3s ease-in-out infinite}
    .cursor{animation:blink 2.6s steps(1) infinite}
    @media(prefers-reduced-motion:reduce){.trace,.status,.cursor{animation:none}}
  </style>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="378" fill="url(#base)"/>
  <rect width="1200" height="378" fill="url(#grid)"/>
  <path d="M0 1H1200M0 377H1200" stroke="#52677B" stroke-opacity=".45"/>
  <path d="M735 0V378" stroke="#C1D0DD" stroke-opacity=".12"/>
  <rect x="42" y="39" width="39" height="39" rx="7" fill="#C6F476"/>
  <text x="61.5" y="64" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="900" fill="#10201A">JS.</text>
  <text x="98" y="54" class="caps" font-size="12" fill="#ECF3FA">JOSH SEGATT</text>
  <text x="98" y="72" class="font" font-size="12" fill="#91A4B4">SOFTWARE ENGINEERING / PRODUCT SYSTEMS</text>
  <text x="42" y="161" class="font" font-size="73" font-weight="800" letter-spacing="-3.7" fill="#F1F5F9">Josh Segatt<tspan fill="#C6F476">.</tspan></text>
  <text x="45" y="197" class="caps" font-size="16" fill="#C6F476">AI AGENT INFRASTRUCTURE  /  FULL-STACK  /  NATIVE</text>
  <path d="M43 218H682" stroke="#6F8195" stroke-opacity=".43"/>
  <text x="44" y="261" class="font" font-size="23" letter-spacing="-.5" fill="#EFF5FA">Build software. Prove it works.</text>
  <text x="44" y="288" class="font" font-size="15" fill="#AEBECE">Product thinking, precise engineering, evidence before claims.</text>
  <g>
    <rect x="42" y="316" width="192" height="29" rx="6" fill="#203026" stroke="#49673D"/>
    <circle cx="58" cy="330.5" r="3.5" fill="#C6F476" class="status"/>
    <text x="72" y="335" class="caps" font-size="10.2" fill="#DBF1C3" letter-spacing="1">UK / CH / REMOTE</text>
    <text x="255" y="335" class="font" font-size="11" fill="#778F9F">joshsegatt.com</text>
  </g>
  <g>
    <rect x="763" y="37" width="396" height="308" rx="11" fill="#101D27" stroke="#375061"/>
    <path d="M763 90H1159" stroke="#375061"/>
    <circle cx="783" cy="63" r="4" fill="#C6F476" class="status"/>
    <text x="796" y="67" class="caps" font-size="11" letter-spacing="1.5" fill="#CDDBE4">ENGINEERING / 001</text>
    <text x="1137" y="67" text-anchor="end" class="font" font-size="11" fill="#708A9D">WORKFLOW</text>
    <path d="M804 127V291" stroke="#3D5361" stroke-width="2"/>
    <path d="M804 127V291" stroke="url(#edge)" stroke-width="2.5" class="trace" stroke-linecap="round"/>
    <g>
      <rect x="784" y="115" width="354" height="50" rx="7" fill="#142630" stroke="#3D5863"/>
      <circle cx="804" cy="140" r="7" fill="#142630" stroke="#C6F476" stroke-width="2"/>
      <text x="829" y="135" class="caps" font-size="11.5" letter-spacing=".8" fill="#C6F476">01 / DEFINE</text>
      <text x="829" y="153" class="font" font-size="12.5" fill="#D1DDE5">Contracts, constraints &amp; risk</text>
      <rect x="784" y="180" width="354" height="50" rx="7" fill="#142630" stroke="#3D5863"/>
      <circle cx="804" cy="205" r="7" fill="#142630" stroke="#A6CBE4" stroke-width="2"/>
      <text x="829" y="200" class="caps" font-size="11.5" letter-spacing=".8" fill="#D3E4F0">02 / ENGINEER</text>
      <text x="829" y="218" class="font" font-size="12.5" fill="#D1DDE5">Architecture, interfaces &amp; code</text>
      <rect x="784" y="245" width="354" height="50" rx="7" fill="#1B2D27" stroke="#709950"/>
      <circle cx="804" cy="270" r="7" fill="#1B2D27" stroke="#C6F476" stroke-width="2" class="status"/>
      <text x="829" y="265" class="caps" font-size="11.5" letter-spacing=".8" fill="#C6F476">03 / VERIFY</text>
      <text x="829" y="283" class="font" font-size="12.5" fill="#E2F0DF">Tests, replay &amp; evidence</text>
    </g>
    <text x="784" y="327" class="font" font-size="10.5" fill="#89A1B0">No magic confidence scores. Inspectable results.</text>
    <rect x="1136" y="317" width="7" height="12" rx="1" fill="#C6F476" class="cursor"/>
  </g>
  <text x="43" y="366" class="font" font-size="9.5" fill="#647D8D">ENGINEERED FOR THE PEOPLE WHO USE IT, AND THE PEOPLE WHO MAINTAIN IT.</text>
</g>
</svg>