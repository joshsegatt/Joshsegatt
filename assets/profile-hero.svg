<circle cx="968" cy="168" r="55" fill="#11293A" stroke="#6C9BBB" stroke-opacity=".5"/>
<path d="M968 86 V250 M886 168 H1050" stroke="url(#accent)" stroke-opacity=".35"/>
<path d="M886 168 H1050" fill="none" stroke="#2DD4BF" stroke-width="2.5" class="flow"/>
<circle cx="968" cy="168" r="24" fill="#173F4A" stroke="#2DD4BF" stroke-opacity=".65"/>
<path d="m956 168 9 9 16-19" fill="none" stroke="#72E9DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#091823" stroke="#58BFB4" stroke-width="1.4">
 <rect x="898" y="41" width="140" height="30" rx="8"/><rect x="1042" y="149" width="133" height="30" rx="8"/><rect x="878" y="264" width="153" height="30" rx="8"/>
</g>
<g class="text" font-size="10" font-weight="700" letter-spacing="1.1" fill="#DBF5F1">
