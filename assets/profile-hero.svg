<circle cx="16" cy="13" r="4" fill="#2DD4BF" class="pulse"/>
<text x="29" y="17" fill="#D6E7F2" class="text" font-size="11" font-weight="600">DESIGN → BUILD → PROVE</text>
<rect x="198" width="144" height="26" rx="13" fill="#142838" stroke="#35546A" stroke-opacity=".75"/>
<text x="212" y="17" fill="#C6D8E6" class="text" font-size="11" font-weight="600">UK / CH / REMOTE</text>
</g>
<g>
<circle cx="968" cy="168" r="123" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity=".16"/>
