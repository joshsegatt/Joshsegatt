<text x="55" y="177" class="text" font-size="73" font-weight="800" letter-spacing="-3.2" fill="#F0F7FC">JOSH SEGATT<tspan fill="#4DDBCC">.</tspan></text>
<text x="58" y="213" class="label" font-size="15" letter-spacing="2" fill="#B5C8D8">FULL-STACK   /   NATIVE   /   AI SYSTEMS</text>
<text x="59" y="252" class="text" font-size="18" fill="#A8BECE">Products people can use. Systems engineers can trust.</text>
