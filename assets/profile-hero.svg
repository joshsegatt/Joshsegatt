<text x="1108" y="168" text-anchor="middle">DELIVERY</text>
<text x="954" y="283" text-anchor="middle">VERIFICATION</text>
</g>
<circle cx="968" cy="78" r="4" fill="#80E5D9" class="pulse"/><circle cx="1058" cy="168" r="4" fill="#80E5D9" class="soft"/><circle cx="968" cy="258" r="4" fill="#80E5D9" class="soft"/>
</g>
<text x="55" y="335" class="text" font-size="11" fill="#6F92AA">01 / SOFTWARE WITH INTENT</text>
<text x="1144" y="335" text-anchor="end" class="text" font-size="11" fill="#6F92AA">joshsegatt.com</text>
