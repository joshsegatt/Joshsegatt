<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="t d">
<title id="t">Josh Segatt — Software Engineer</title>
<desc id="d">Dark editorial cover with animated system map. Full-stack engineering, native tooling, and reliable AI systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070F1D"/><stop offset=".58" stop-color="#0B1B2A"/><stop offset="1" stop-color="#07111D"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2DD4BF" stop-opacity=".23"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#93A9BD" stroke-opacity=".095" stroke-width=".8"/></pattern>
  <clipPath id="frame"><rect width="1200" height="352" rx="22"/></clipPath>
  <style>
  .label{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700;letter-spacing:3px}
  .text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  @keyframes dash{to{stroke-dashoffset:-84}}
  @keyframes pulse{0%,100%{opacity:.45;r:4}50%{opacity:1;r:7}}
  @keyframes float{0%,100%{opacity:.32}50%{opacity:.7}}
  .flow{stroke-dasharray:8 12;animation:dash 8s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .soft{animation:float 5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.flow,.pulse,.soft{animation:none}}
  </style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="352" fill="url(#bg)"/>
<rect width="1200" height="352" fill="url(#grid)"/>
<circle cx="974" cy="170" r="290" fill="url(#glow)"/>
<path d="M0 351 L560 351 L730 0 L1200 0" fill="none" stroke="#5F87AB" stroke-opacity=".11" stroke-width="2"/>
<path d="M0 310H1200" stroke="#8EA9C0" stroke-opacity=".14"/>
<rect x="54" y="42" width="45" height="45" rx="11" fill="#102A3E" stroke="#2DD4BF" stroke-opacity=".5"/>
<text x="76.5" y="71" text-anchor="middle" font-size="17" fill="#D9FDF8" font-weight="800" class="text">JS</text>
