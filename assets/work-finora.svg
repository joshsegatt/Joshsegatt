<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
<title id="t">Finora: personal finance for Android, iOS next. Shows what is safe to spend this month; data stays on the phone.</title>
<defs>
  <linearGradient id="b" x2="1" y2="1"><stop stop-color="#0C1118"/><stop offset=".6" stop-color="#101A24"/><stop offset="1" stop-color="#0C131C"/></linearGradient>
  <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E0EA" stroke-opacity=".045"/></pattern>
  <clipPath id="r"><rect width="1200" height="250" rx="14"/></clipPath>
  <style>
    .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .c{font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;font-weight:700}
    @keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes rt{to{stroke-dashoffset:-84}}
    .s{animation:br 3s ease-in-out infinite}
    .tr{stroke-dasharray:5 9;animation:rt 8s linear infinite}
    @media(prefers-reduced-motion:reduce){.s,.tr{animation:none}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="250" fill="url(#b)"/><rect width="1200" height="250" fill="url(#g)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="14" fill="none" stroke="#52677B" stroke-opacity=".5"/>
  <path d="M735 0V250" stroke="#C1D0DD" stroke-opacity=".12"/>
  <text x="44" y="46" class="c" font-size="11.5" fill="#C6F476">05</text>
  <text x="73" y="46" class="c" font-size="11.5" fill="#778F9F">/  MOBILE · SG TECNOLOGIA E AUTOMAÇÕES</text>
  <text x="42" y="92" class="f" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#F1F5F9">Finora<tspan fill="#C6F476">.</tspan></text>
  <text x="44" y="124" class="f" font-size="16.5" fill="#AEBECE">Personal finance that shows what is still safe to spend</text><text x="44" y="148" class="f" font-size="16.5" fill="#AEBECE">this month. Data stays on the phone, no account.</text>
  <rect x="44" y="178" width="164" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="126" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Kotlin Multiplatform</text><rect x="216.0" y="178" width="68" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="250" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Compose</text><rect x="291.8" y="178" width="46" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="315" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Room</text>
  <circle cx="50" cy="228" r="3.5" fill="#C6F476" class="s"/>
  <text x="62" y="232" class="c" font-size="10.5" fill="#DBF1C3" letter-spacing="1.2">CLOSED TESTING ON GOOGLE PLAY · iOS NEXT</text>
  <g transform="translate(763 30)"><defs><linearGradient id="fg" x2="1" y2="1"><stop stop-color="#178C5E"/><stop offset="1" stop-color="#073F29"/></linearGradient></defs><rect width="396" height="190" rx="18" fill="url(#fg)"/><text x="24" y="38" class="f" font-size="13" fill="#D6F2E4">Safe to spend until Nov 30</text><text x="22" y="86" class="f" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#fff">$968.25</text><text x="24" y="112" class="f" font-size="12.5" fill="#BFE6D2">About $121 a day · on pace</text><rect x="24" y="134" width="348" height="5" rx="2.5" fill="#ffffff" fill-opacity=".25"/><rect x="24" y="134" width="115" height="5" rx="2.5" fill="#7BE0B0"/><text x="24" y="166" class="f" font-size="11.5" fill="#BFE6D2">33% of budget used</text><text x="372" y="166" text-anchor="end" class="f" font-size="11.5" fill="#BFE6D2">Day 23 of 30</text></g>
</g>
</svg>
