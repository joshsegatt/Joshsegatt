<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
<title id="t">chit: a delivery gate. Red at HEAD, green after the patch, independent replay, reviewable receipt.</title>
<defs>
  <linearGradient id="b" x2="1" y2="1"><stop stop-color="#0C1118"/><stop offset=".6" stop-color="#101A24"/><stop offset="1" stop-color="#0C131C"/></linearGradient>
  <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E0EA" stroke-opacity=".045"/></pattern>
  <clipPath id="r"><rect width="1200" height="250" rx="14"/></clipPath>
  <style>
    .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .c{font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;font-weight:700}
    @keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes rt{to{stroke-dashoffset:-84}}
    .s{animation:br 3s ease-in-out infinite}
    .tr{stroke-dasharray:5 9;animation:rt 8s linear infinite}
    @media(prefers-reduced-motion:reduce){.s,.tr{animation:none}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="250" fill="url(#b)"/><rect width="1200" height="250" fill="url(#g)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="14" fill="none" stroke="#52677B" stroke-opacity=".5"/>
  <path d="M735 0V250" stroke="#C1D0DD" stroke-opacity=".12"/>
  <text x="44" y="46" class="c" font-size="11.5" fill="#C6F476">02</text>
  <text x="73" y="46" class="c" font-size="11.5" fill="#778F9F">/  VERIFICATION</text>
  <text x="42" y="92" class="f" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#F1F5F9">chit<tspan fill="#C6F476">.</tspan></text>
  <text x="44" y="124" class="f" font-size="16.5" fill="#AEBECE">A deterministic delivery gate: the same test must fail</text><text x="44" y="148" class="f" font-size="16.5" fill="#AEBECE">at HEAD and pass after the patch, then replay.</text>
  <rect x="44" y="178" width="60" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="74" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Python</text><rect x="112.4" y="178" width="112" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="168" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">git worktrees</text><rect x="232.60000000000002" y="178" width="112" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="289" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">HTML receipts</text>
  <circle cx="50" cy="228" r="3.5" fill="#C6F476" class="s"/>
  <text x="62" y="232" class="c" font-size="10.5" fill="#DBF1C3" letter-spacing="1.2">PROVES THE TEST, STATES WHAT IT DOES NOT</text>
  <g transform="translate(763 30)"><rect width="396" height="190" rx="11" fill="#101D27" stroke="#375061"/><path d="M0 40H396" stroke="#375061"/><circle cx="20" cy="20" r="4" fill="#C6F476" class="s"/><text x="34" y="24" class="c" font-size="10.5" fill="#E2F0DF">DELIVERY GATE</text><text x="378" y="24" text-anchor="end" class="c" font-size="10" fill="#778F9F">SAME TEST</text><rect x="20" y="66" width="76" height="80" rx="9" fill="#142630" stroke="#E5484D" stroke-opacity=".8"/><circle cx="58" cy="92" r="7" fill="#E5484D"/><text x="58" y="121" text-anchor="middle" class="c" font-size="10" fill="#F1F5F9" letter-spacing="1">RED</text><text x="58" y="136" text-anchor="middle" class="f" font-size="10.5" fill="#778F9F">at HEAD</text><path d="M99 106H109M105 102L109 106L105 110" fill="none" stroke="#C6F476" stroke-width="1.6"/><rect x="112" y="66" width="76" height="80" rx="9" fill="#142630" stroke="#C6F476" stroke-opacity=".8"/><circle cx="150" cy="92" r="7" fill="#C6F476"/><text x="150" y="121" text-anchor="middle" class="c" font-size="10" fill="#F1F5F9" letter-spacing="1">GREEN</text><text x="150" y="136" text-anchor="middle" class="f" font-size="10.5" fill="#778F9F">after patch</text><path d="M191 106H201M197 102L201 106L197 110" fill="none" stroke="#C6F476" stroke-width="1.6"/><rect x="204" y="66" width="76" height="80" rx="9" fill="#142630" stroke="#8DDBDF" stroke-opacity=".8"/><circle cx="242" cy="92" r="7" fill="#8DDBDF"/><text x="242" y="121" text-anchor="middle" class="c" font-size="10" fill="#F1F5F9" letter-spacing="1">REPLAY</text><text x="242" y="136" text-anchor="middle" class="f" font-size="10.5" fill="#778F9F">independent</text><path d="M283 106H293M289 102L293 106L289 110" fill="none" stroke="#C6F476" stroke-width="1.6"/><rect x="296" y="66" width="76" height="80" rx="9" fill="#142630" stroke="#E2F0DF" stroke-opacity=".8"/><circle cx="334" cy="92" r="7" fill="#E2F0DF"/><text x="334" y="121" text-anchor="middle" class="c" font-size="10" fill="#F1F5F9" letter-spacing="1">RECEIPT</text><text x="334" y="136" text-anchor="middle" class="f" font-size="10.5" fill="#778F9F">HTML</text><text x="20" y="176" class="f" font-size="11.5" fill="#778F9F">No receipt, no delivery verdict.</text></g>
</g>
</svg>
