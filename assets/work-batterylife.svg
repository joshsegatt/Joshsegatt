<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
<title id="t">BatteryLife: a Windows 11 tray hub that shows which wireless device to charge next and how long is left.</title>
<defs>
  <linearGradient id="b" x2="1" y2="1"><stop stop-color="#0C1118"/><stop offset=".6" stop-color="#101A24"/><stop offset="1" stop-color="#0C131C"/></linearGradient>
  <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E0EA" stroke-opacity=".045"/></pattern>
  <clipPath id="r"><rect width="1200" height="250" rx="14"/></clipPath>
  <style>
    .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .c{font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;font-weight:700}
    @keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes rt{to{stroke-dashoffset:-84}}
    .s{animation:br 3s ease-in-out infinite}
    .tr{stroke-dasharray:5 9;animation:rt 8s linear infinite}
    @media(prefers-reduced-motion:reduce){.s,.tr{animation:none}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="250" fill="url(#b)"/><rect width="1200" height="250" fill="url(#g)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="14" fill="none" stroke="#52677B" stroke-opacity=".5"/>
  <path d="M735 0V250" stroke="#C1D0DD" stroke-opacity=".12"/>
  <text x="44" y="46" class="c" font-size="11.5" fill="#C6F476">04</text>
  <text x="73" y="46" class="c" font-size="11.5" fill="#778F9F">/  WINDOWS 11 · OPEN SOURCE</text>
  <text x="42" y="92" class="f" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#F1F5F9">BatteryLife<tspan fill="#C6F476">.</tspan></text>
  <text x="44" y="124" class="f" font-size="16.5" fill="#AEBECE">Wireless battery, read like an airport sign: what to</text><text x="44" y="148" class="f" font-size="16.5" fill="#AEBECE">charge next and how long is left. Read-only.</text>
  <rect x="44" y="178" width="46" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="67" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Rust</text><rect x="97.6" y="178" width="90" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="143" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">Windows 11</text><rect x="195.6" y="178" width="68" height="26" rx="6" fill="#142630" stroke="#375061"/><text x="230" y="195.5" text-anchor="middle" class="f" font-size="12.5" fill="#D1DDE5">GPL-3.0</text>
  <circle cx="50" cy="228" r="3.5" fill="#C6F476" class="s"/>
  <text x="62" y="232" class="c" font-size="10.5" fill="#DBF1C3" letter-spacing="1.2">77 DRIVERS · 378 TESTS · PORTED FROM BATTERYHUB</text>
  <g transform="translate(763 30)"><rect width="396" height="190" rx="11" fill="#0A0A0A" stroke="#375061"/><rect x="0" y="0" width="396" height="92" rx="11" fill="#F5C400"/><rect x="0" y="80" width="396" height="12" fill="#F5C400"/><text x="20" y="32" class="c" font-size="10.5" fill="#1A1600">NEXT ACTION</text><text x="20" y="60" class="f" font-size="17" font-weight="800" fill="#111">Charge the headset</text><text x="376" y="66" text-anchor="end" class="f" font-size="30" font-weight="800" letter-spacing="-1" fill="#111">2 h 10</text><text x="20" y="118" class="f" font-size="13" fill="#E8E8E8">Mouse</text><text x="376" y="118" text-anchor="end" class="f" font-size="13" font-weight="700" fill="#E8E8E8">64%</text><text x="20" y="142" class="f" font-size="13" fill="#E8E8E8">Keyboard</text><text x="376" y="142" text-anchor="end" class="f" font-size="13" font-weight="700" fill="#E8E8E8">81%</text><text x="20" y="166" class="f" font-size="13" fill="#E8E8E8">Phone</text><text x="376" y="166" text-anchor="end" class="f" font-size="13" font-weight="700" fill="#E8E8E8">57%</text></g>
</g>
</svg>
