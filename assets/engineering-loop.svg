<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Evidence-driven delivery: baseline, patch, replay, receipt</title>
<desc id="desc">Four-step technical illustration based on the chit verification flow. Establish a red baseline at HEAD, confirm green after a patch, replay in an isolated worktree and produce a reviewable receipt.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D141D"/><stop offset="1" stop-color="#13232D"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#98C4E6"/><stop offset="1" stop-color="#C6F476"/></linearGradient>
 <style>
 .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
 .over{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:700;letter-spacing:1.9px}
 @keyframes stream{to{stroke-dashoffset:-70}}
 @keyframes brighten{0%,100%{opacity:.55}50%{opacity:1}}
 .stream{stroke-dasharray:5 9;animation:stream 6.5s linear infinite}
 .glow{animation:brighten 2.9s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.stream,.glow{animation:none}}
 </style>
</defs>
<rect width="1200" height="270" rx="15" fill="url(#bg)"/>
<path d="M0 53H1200 M0 225H1200" stroke="#506473" stroke-opacity=".42"/>
<text x="32" y="33" class="over" font-size="12" fill="#DAE8F1">THE VERIFICATION PATH</text>
<text x="1167" y="33" text-anchor="end" class="f" font-size="12" fill="#8FA8BA">chit / deterministic gates</text>
<path d="M279 142H325 M579 142H625 M879 142H925" fill="none" stroke="#415A6D" stroke-width="3"/>
<path d="M279 142H325 M579 142H625 M879 142H925" fill="none" stroke="url(#line)" stroke-width="2.6" class="stream"/>
<g class="f">
<rect x="30" y="72" width="249" height="139" rx="9" fill="#152631" stroke="#436074"/>
<rect x="325" y="72" width="254" height="139" rx="9" fill="#152631" stroke="#436074"/>
<rect x="625" y="72" width="254" height="139" rx="9" fill="#152631" stroke="#436074"/>
<rect x="925" y="72" width="244" height="139" rx="9" fill="#1B302C" stroke="#759C52"/>
<rect x="48" y="88" width="45" height="23" rx="5" fill="#2F2932" stroke="#8F5965"/>
<text x="70.5" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#FFACAD">RED</text>
<rect x="343" y="88" width="54" height="23" rx="5" fill="#213A30" stroke="#537E60"/>
<text x="370" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#B8EFBC">GREEN</text>
<rect x="643" y="88" width="64" height="23" rx="5" fill="#243646" stroke="#6F9CB9"/>
<text x="675" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#BDDDF4">REPEAT</text>
<rect x="943" y="88" width="69" height="23" rx="5" fill="#273D2E" stroke="#709B4F"/>
<text x="977.5" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#C6F476" class="glow">EVIDENCE</text>
<text x="48" y="142" font-size="20" font-weight="700" fill="#F0F6FA">01 / Baseline</text>
<text x="48" y="166" font-size="13.5" fill="#AEC1D0">Test fails at HEAD;</text>
<text x="48" y="184" font-size="13.5" fill="#AEC1D0">expected oracle appears.</text>
<text x="343" y="142" font-size="20" font-weight="700" fill="#F0F6FA">02 / Patch</text>
<text x="343" y="166" font-size="13.5" fill="#AEC1D0">The same test passes</text>
<text x="343" y="184" font-size="13.5" fill="#AEC1D0">after the change.</text>
<text x="643" y="142" font-size="20" font-weight="700" fill="#F0F6FA">03 / Replay</text>
<text x="643" y="166" font-size="13.5" fill="#AEC1D0">A second worktree</text>
<text x="643" y="184" font-size="13.5" fill="#AEC1D0">checks both outcomes.</text>
<text x="943" y="142" font-size="20" font-weight="700" fill="#F0F6FA">04 / Receipt</text>
<text x="943" y="166" font-size="13.5" fill="#C9DCCB">Deliver a gate verdict</text>
<text x="943" y="184" font-size="13.5" fill="#C9DCCB">with reviewable proof.</text>
<text x="32" y="248" font-size="12.5" fill="#9DB1BF">A verified test is not a guarantee that the specification itself is correct. Humans still own the contract.</text>
<text x="1167" y="248" text-anchor="end" font-size="10" fill="#6C8896">TRACE 01 / 01</text>
</g>
</svg>